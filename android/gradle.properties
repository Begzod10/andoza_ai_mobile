org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Gradle 8.8's embedded Kotlin/IntelliJ JavaVersion parser cannot parse "26.0.1"
# (the system default JDK), which surfaces as a cryptic "26.0.1" build failure,
# so Gradle must run on a supported JDK. Don't hardcode a path here — it is not
# portable across machines. Point Flutter at the JDK instead, which it passes
# through to Gradle:
#     flutter config --jdk-dir="/path/to/jdk-21"
# (or set JAVA_HOME / org.gradle.java.home in ~/.gradle/gradle.properties).
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin version specification
kotlin.version=2.2.20

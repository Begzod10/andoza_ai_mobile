name: Release AAB

# Builds a signed Play-ready Android App Bundle.
#
# Triggers:
#   - pushing a version tag like `v1.2.3`
#   - manual run from the Actions tab (workflow_dispatch)
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_B64   base64 of the upload keystore:  base64 -w0 ~/andoza-upload.jks
#   KEY_PROPERTIES         (optional) the full android/key.properties file contents,
#                          with storeFile pointing at the decoded keystore path below.
#                          If you provide this you can omit the three secrets below.
#   KEYSTORE_PASSWORD      keystore store password        (used if KEY_PROPERTIES is not set)
#   KEY_PASSWORD           key password (same as store for a PKCS12 keystore)
#   KEY_ALIAS              key alias, e.g. `andoza`
#
# Publishing to Google Play is intentionally DISABLED. See the commented
# "Publish to Play internal track" step at the bottom — enabling it requires
# registering the app in the Play Console and adding a PLAY_SERVICE_ACCOUNT_JSON
# secret. See docs/RELEASE_SIGNING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/andoza-upload.jks"

      - name: Write key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEY_PROPERTIES" ]; then
            # Use the provided key.properties verbatim, but force the storeFile
            # to the keystore we just decoded so the path is valid on the runner.
            printf '%s\n' "$KEY_PROPERTIES" \
              | grep -v '^storeFile=' > android/key.properties
            echo "storeFile=$RUNNER_TEMP/andoza-upload.jks" >> android/key.properties
          else
            {
              echo "storeFile=$RUNNER_TEMP/andoza-upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed AAB
        run: |
          flutter build appbundle --release \
            --dart-define=API_URL=http://189.74.96.11:8000/api/v1 \
            --dart-define=API_BASE_URL=http://189.74.96.11:8000 \
            --dart-define=STUDIO_BASE_URL=http://189.74.96.11:5173

      - name: Verify signer (fails if debug-signed)
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::AAB is debug-signed — release signing did not apply."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Clean up secrets on runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/andoza-upload.jks"

      # --------------------------------------------------------------------
      # Publish to Play internal track — DISABLED.
      #
      # Prerequisites before enabling:
      #   1. Register the app in the Google Play Console (create the app entry;
      #      the applicationId is com.tamir_uy.tamir_uy_mobile_flutter).
      #   2. Create a Google Cloud service account with the Play Developer API,
      #      grant it release access in the Play Console, download its JSON key,
      #      and store the JSON as the PLAY_SERVICE_ACCOUNT_JSON secret.
      #   3. Do the FIRST upload manually so Google enrolls the app in Play App
      #      Signing (your upload key signs; Google re-signs with the app key).
      #
      # Then uncomment:
      #
      # - name: Publish to Play internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.tamir_uy.tamir_uy_mobile_flutter
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed

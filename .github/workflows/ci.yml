name: CI

# Static analysis + unit/widget tests on every push to main and on PRs.
# Deliberately does NOT build a release, sign, or touch secrets — this is a
# fast correctness gate only.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only errors should fail CI — the codebase carries pre-existing
      # info/warning lints that are not part of this gate.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

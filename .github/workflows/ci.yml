name: CI

# Static analysis, unit/widget tests and an Android build on every push to
# main and on PRs.
# Deliberately does NOT sign with the upload key or touch secrets — this is a
# fast correctness gate only.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only errors should fail CI — the codebase carries pre-existing
      # info/warning lints that are not part of this gate.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  # Builds an Android release APK (debug-signed: no keystore, no secrets) so a
  # Flutter, Gradle or AGP mismatch fails here instead of at release time.
  # Flutter 3.47.5 stopped compiling on Gradle 8.14.3 and nothing noticed,
  # because no job built Android.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release, debug-signed)
        run: |
          flutter build apk --release \
            --dart-define=API_URL=https://andoza.jumaniyozov.uz/api/v1 \
            --dart-define=API_BASE_URL=https://andoza.jumaniyozov.uz \
            --dart-define=STUDIO_BASE_URL=https://andoza.jumaniyozov.uz
